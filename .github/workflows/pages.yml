name: Deploy site

# Deploys the gallery whenever it is updated by the publisher (pushes to campaign-chronicle/docs/).
on:
  push:
    branches: [main]
    paths: ["campaign-chronicle/docs/**"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: campaign-chronicle/docs
      - id: deployment
        uses: actions/deploy-pages@v4
